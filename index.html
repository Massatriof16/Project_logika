<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulasi Sistem Keamanan Rumah</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Simulasi Sistem Keamanan Rumah</h1>
            <p>Berbasis Logika Proposisi + Geofencing GPS</p>
        </header>
        
        <div class="dashboard">
            <!-- Status Ring -->
            <div class="status-ring">
                <svg width="200" height="200">
                    <circle cx="100" cy="100" r="90" stroke="#ddd" stroke-width="10" fill="none" />
                    <circle cx="100" cy="100" r="90" stroke="#4CAF50" stroke-width="10" fill="none" stroke-dasharray="565" stroke-dashoffset="0" id="status-circle" />
                </svg>
                <div class="status-text" id="status-text">Aman</div>
            </div>
            
            <!-- Panel Lokasi -->
            <div class="card">
                <h2>Lokasi & Geofencing</h2>
                <div class="location-info">
                    <p>Posisi Anda: <span id="user-lat">Memuat...</span>, <span id="user-lng">Memuat...</span></p>
                    <p>Lokasi Rumah: <span id="home-lat">-</span>, <span id="home-lng">-</span></p>
                    <p>Jarak: <span id="distance">-</span> meter</p>
                    <button id="set-home-btn">Set Lokasi Rumah</button>
                    <label>Radius Aman (meter): <input type="number" id="radius-input" min="50" max="100" value="50"></label>
                    <button id="save-radius-btn">Simpan Radius</button>
                </div>
            </div>
            
            <!-- Panel Sensor -->
            <div class="card">
                <h2>Sensor Virtual</h2>
                <div class="sensor-list">
                    <label class="sensor-item">
                        <input type="checkbox" id="P" onchange="updateSimulation()">
                        <span>Pintu terkunci (P)</span>
                        <span class="sensor-status" id="P-status">Tidak Aman</span>
                    </label>
                    <label class="sensor-item">
                        <input type="checkbox" id="J" onchange="updateSimulation()">
                        <span>Jendela tertutup (J)</span>
                        <span class="sensor-status" id="J-status">Tidak Aman</span>
                    </label>
                    <label class="sensor-item">
                        <input type="checkbox" id="S" onchange="updateSimulation()">
                        <span>Tidak ada asap (S)</span>
                        <span class="sensor-status" id="S-status">Tidak Aman</span>
                    </label>
                    <label class="sensor-item">
                        <input type="checkbox" id="motion" onchange="updateSimulation()">
                        <span>Sensor gerak (opsional)</span>
                        <span class="sensor-status" id="motion-status">Tidak Aman</span>
                    </label>
                </div>
            </div>
            
            <!-- Panel Notifikasi -->
            <div class="card">
                <h2>Notifikasi</h2>
                <button id="request-notification-btn">Izinkan Notifikasi</button>
                <div class="notification-log" id="notification-log">
                    <p>Log Notifikasi:</p>
                    <ul id="log-list"></ul>
                </div>
            </div>
            
            <!-- Log Aktivitas -->
            <div class="card">
                <h2>Log Aktivitas</h2>
                <ul id="activity-log"></ul>
            </div>
        </div>
    </div>
    
    <script src="logic.js"></script>
</body>
</html>
